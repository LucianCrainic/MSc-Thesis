<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="MSc Thesis — quantized LLM inference on HBM-equipped CPUs">
  <title>MSc Thesis — quantized LLM inference on HBM-equipped CPUs</title>
  <desc>Two memory tiers on one Xeon Max socket: on-package HBM2e on a wide path, DDR5 on a narrow one.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="55%" stop-color="#0c111a"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#800020"/>
      <stop offset="55%" stop-color="#a8203c"/>
      <stop offset="100%" stop-color="#d57d1c"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8203c"/>
      <stop offset="100%" stop-color="#d57d1c" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="hbmFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d57d1c" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#d57d1c" stop-opacity="0.14"/>
    </linearGradient>

    <linearGradient id="ddrFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5f86c0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#5f86c0" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="wide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d57d1c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#d57d1c" stop-opacity="0.25"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.12" cy="0.9" r="0.85">
      <stop offset="0%" stop-color="#800020" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#800020" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="0.80" cy="0.34" r="0.46">
      <stop offset="0%" stop-color="#d57d1c" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#d57d1c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow3" cx="0.80" cy="0.82" r="0.34">
      <stop offset="0%" stop-color="#5f86c0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#5f86c0" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8fa3c0" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="300" rx="18"/>
    </clipPath>

    <!-- ── icon glyphs, drawn on a 14×14 grid ───────────────────────── -->
    <g id="ic-doc" fill="none" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round">
      <path d="M3.5 1.5h5l3 3v8h-8z"/>
      <path d="M8.5 1.5v3h3"/>
      <path d="M5.5 8h4M5.5 10.2h2.6"/>
    </g>
    <g id="ic-build" fill="none" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round">
      <path d="M7 1.6 12.2 4.4v5.4L7 12.6 1.8 9.8V4.4z"/>
      <path d="M1.8 4.4 7 7.1l5.2-2.7M7 7.1v5.5"/>
    </g>
    <g id="ic-code" fill="none" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M5 3.6 1.7 7l3.3 3.4"/>
      <path d="M9 3.6 12.3 7 9 10.4"/>
    </g>
    <g id="ic-chip" fill="none" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round">
      <rect x="3.6" y="3.6" width="6.8" height="6.8" rx="1.2"/>
      <path d="M5.6 1.4v2.2M8.4 1.4v2.2M5.6 10.4v2.2M8.4 10.4v2.2M1.4 5.6h2.2M1.4 8.4h2.2M10.4 5.6h2.2M10.4 8.4h2.2"/>
    </g>
    <g id="ic-rack" fill="none" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round">
      <rect x="1.8" y="2" width="10.4" height="3.1" rx="0.9"/>
      <rect x="1.8" y="6.4" width="10.4" height="3.1" rx="0.9"/>
      <path d="M1.8 11.4h10.4"/>
      <path d="M4 3.55h0.01M4 7.95h0.01"/>
    </g>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <rect width="1200" height="300" fill="url(#glow2)"/>
    <rect width="1200" height="300" fill="url(#glow3)"/>
    <rect x="0" y="0" width="7" height="300" fill="url(#edge)"/>

    <!-- ══ left column ═══════════════════════════════════════════════ -->
    <g font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">
      <circle cx="66" cy="66" r="4" fill="#d57d1c"/>
      <text x="82" y="71" font-size="13" letter-spacing="2.8" fill="#93a1b5">MSC THESIS  ·  SAPIENZA UNIVERSITY OF ROME</text>
    </g>

    <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif">
      <text x="64" y="148" font-size="66" font-weight="700" letter-spacing="1.5" fill="#f4f7fb">TODO</text>

      <rect x="274" y="115" width="132" height="26" rx="13" fill="#800020" fill-opacity="0.22" stroke="#a8203c" stroke-opacity="0.55"/>
      <text x="340" y="133" font-size="12" letter-spacing="1.4" text-anchor="middle" fill="#e5a3b1"
            font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">working title</text>

      <rect x="64" y="163" width="300" height="2" rx="1" fill="url(#rule)"/>

      <text x="64" y="199" font-size="17.5" fill="#a2adbd">Quantized large-language-model inference on HBM-equipped CPUs:</text>
      <text x="64" y="224" font-size="17.5" fill="#a2adbd">isolating on-package high-bandwidth memory from DDR5 on one socket.</text>
    </g>

    <!-- tech pills -->
    <g font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="0.4">
      <g transform="translate(64,246)">
        <rect width="72" height="26" rx="7" fill="#7d8aa0" fill-opacity="0.07" stroke="#3d4a5e" stroke-opacity="0.75"/>
        <g transform="translate(9,6)" stroke="#d57d1c" stroke-opacity="0.9"><use href="#ic-doc"/></g>
        <text x="29" y="17" fill="#8e9bad">LaTeX</text>
      </g>
      <g transform="translate(144,246)">
        <rect width="90" height="26" rx="7" fill="#7d8aa0" fill-opacity="0.07" stroke="#3d4a5e" stroke-opacity="0.75"/>
        <g transform="translate(9,6)" stroke="#d57d1c" stroke-opacity="0.9"><use href="#ic-build"/></g>
        <text x="29" y="17" fill="#8e9bad">Tectonic</text>
      </g>
      <g transform="translate(242,246)">
        <rect width="98" height="26" rx="7" fill="#7d8aa0" fill-opacity="0.07" stroke="#3d4a5e" stroke-opacity="0.75"/>
        <g transform="translate(9,6)" stroke="#a8203c" stroke-opacity="1"><use href="#ic-code"/></g>
        <text x="29" y="17" fill="#8e9bad">llama.cpp</text>
      </g>
      <g transform="translate(348,246)">
        <rect width="134" height="26" rx="7" fill="#7d8aa0" fill-opacity="0.07" stroke="#3d4a5e" stroke-opacity="0.75"/>
        <g transform="translate(9,6)" stroke="#d57d1c" stroke-opacity="0.9"><use href="#ic-chip"/></g>
        <text x="29" y="17" fill="#8e9bad">Xeon Max 9480</text>
      </g>
      <g transform="translate(490,246)">
        <rect width="88" height="26" rx="7" fill="#7d8aa0" fill-opacity="0.07" stroke="#3d4a5e" stroke-opacity="0.75"/>
        <g transform="translate(9,6)" stroke="#5f86c0" stroke-opacity="0.95"><use href="#ic-rack"/></g>
        <text x="29" y="17" fill="#8e9bad">CRESCO8</text>
      </g>
    </g>

    <!-- ══ right panel: two tiers, one socket ════════════════════════ -->
    <g transform="translate(-18,0)">

      <!-- HBM: four stacked-die towers -->
      <g>
        <g fill="url(#hbmFill)" stroke="#d57d1c" stroke-opacity="0.8" stroke-width="1">
          <rect x="916" y="60" width="22" height="5.4" rx="1.2"/>
          <rect x="916" y="67" width="22" height="5.4" rx="1.2"/>
          <rect x="916" y="74" width="22" height="5.4" rx="1.2"/>
          <rect x="916" y="81" width="22" height="5.4" rx="1.2"/>
          <rect x="944" y="60" width="22" height="5.4" rx="1.2"/>
          <rect x="944" y="67" width="22" height="5.4" rx="1.2"/>
          <rect x="944" y="74" width="22" height="5.4" rx="1.2"/>
          <rect x="944" y="81" width="22" height="5.4" rx="1.2"/>
          <rect x="972" y="60" width="22" height="5.4" rx="1.2"/>
          <rect x="972" y="67" width="22" height="5.4" rx="1.2"/>
          <rect x="972" y="74" width="22" height="5.4" rx="1.2"/>
          <rect x="972" y="81" width="22" height="5.4" rx="1.2"/>
          <rect x="1000" y="60" width="22" height="5.4" rx="1.2"/>
          <rect x="1000" y="67" width="22" height="5.4" rx="1.2"/>
          <rect x="1000" y="74" width="22" height="5.4" rx="1.2"/>
          <rect x="1000" y="81" width="22" height="5.4" rx="1.2"/>
        </g>
        <text x="1040" y="72" font-size="11" letter-spacing="1.5" fill="#d57d1c"
              font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">HBM2e · 64 GB</text>
        <text x="1040" y="87" font-size="10" letter-spacing="0.8" fill="#9d8560"
              font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">~840 GB/s</text>
      </g>

      <!-- wide path: HBM to package -->
      <g fill="url(#wide)">
        <rect x="917" y="87" width="5" height="28"/>
        <rect x="929" y="87" width="5" height="28"/>
        <rect x="941" y="87" width="5" height="28"/>
        <rect x="953" y="87" width="5" height="28"/>
        <rect x="965" y="87" width="5" height="28"/>
        <rect x="977" y="87" width="5" height="28"/>
        <rect x="989" y="87" width="5" height="28"/>
        <rect x="1001" y="87" width="5" height="28"/>
        <rect x="1013" y="87" width="5" height="28"/>
      </g>

      <!-- socket package -->
      <rect x="906" y="114" width="124" height="88" rx="9" fill="#141b26" stroke="#3d4a5e" stroke-width="1.4"/>
      <rect x="916" y="124" width="104" height="68" rx="4" fill="#0e141d" stroke="#2c3646" stroke-width="1"/>
      <g fill="#2f3b4d">
        <rect x="924" y="132" width="13" height="13" rx="2"/>
        <rect x="941" y="132" width="13" height="13" rx="2"/>
        <rect x="958" y="132" width="13" height="13" rx="2"/>
        <rect x="975" y="132" width="13" height="13" rx="2"/>
        <rect x="992" y="132" width="13" height="13" rx="2"/>
        <rect x="924" y="151" width="13" height="13" rx="2"/>
        <rect x="941" y="151" width="13" height="13" rx="2"/>
        <rect x="975" y="151" width="13" height="13" rx="2"/>
        <rect x="992" y="151" width="13" height="13" rx="2"/>
        <rect x="924" y="170" width="13" height="13" rx="2"/>
        <rect x="941" y="170" width="13" height="13" rx="2"/>
        <rect x="958" y="170" width="13" height="13" rx="2"/>
        <rect x="975" y="170" width="13" height="13" rx="2"/>
        <rect x="992" y="170" width="13" height="13" rx="2"/>
      </g>
      <rect x="958" y="151" width="13" height="13" rx="2" fill="#a8203c" fill-opacity="0.9"/>
      <text x="1040" y="155" font-size="11" letter-spacing="1.5" fill="#93a1b5"
            font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">ONE SOCKET</text>
      <text x="1040" y="170" font-size="10" letter-spacing="0.8" fill="#78859a"
            font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">56 cores · AMX</text>

      <!-- narrow path: package to DDR -->
      <g fill="#5f86c0" fill-opacity="0.5">
        <rect x="965" y="201" width="2.5" height="26"/>
        <rect x="973" y="201" width="2.5" height="26"/>
      </g>

      <!-- DDR5 DIMMs -->
      <g>
        <g fill="url(#ddrFill)" stroke="#5f86c0" stroke-opacity="0.7" stroke-width="1">
          <rect x="916" y="226" width="7.5" height="26" rx="1.5"/>
          <rect x="928" y="226" width="7.5" height="26" rx="1.5"/>
          <rect x="940" y="226" width="7.5" height="26" rx="1.5"/>
          <rect x="952" y="226" width="7.5" height="26" rx="1.5"/>
          <rect x="964" y="226" width="7.5" height="26" rx="1.5"/>
          <rect x="976" y="226" width="7.5" height="26" rx="1.5"/>
          <rect x="988" y="226" width="7.5" height="26" rx="1.5"/>
          <rect x="1000" y="226" width="7.5" height="26" rx="1.5"/>
        </g>
        <text x="1040" y="238" font-size="11" letter-spacing="1.5" fill="#5f86c0"
              font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">DDR5</text>
        <text x="1040" y="253" font-size="10" letter-spacing="0.8" fill="#6d84a4"
              font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">~245 GB/s</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#2a3444" stroke-opacity="0.9"/>
  </g>
</svg>
